site_name: Android Dev Masterclass — Study Notes
site_description: >-
  Personal study notes and transcripts for Danis Panjuta's Android 14 &
  Kotlin Masterclass (Jetpack Compose + XML tracks), with full-text search.
repo_url: https://github.com/Nileshsri2022/learnAndroidDev
repo_name: Nileshsri2022/learnAndroidDev

docs_dir: docs
site_dir: site

# Rebuild when the underlying course material changes.
watch:
  - ../DanisPanjuta

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.instant
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.prune
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - gen-files:
      scripts:
        - hooks/gen_notes.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
